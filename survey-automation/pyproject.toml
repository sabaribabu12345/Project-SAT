[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-automation-v3"
version = "0.1.0"
description = "Survey automation platform v3 (Skyvern edition)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0.43",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "databricks-sdk>=0.73.0",
  "temporalio>=1.8.0",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["apps*"]
